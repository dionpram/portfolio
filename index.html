<style>
:root{--bg:#f9fafb;--ink:#111827;--body:#374151;--muted:#6b7280;--green:#15803d;--orange:#ff9340;--bar:#f4f3f6;--blue:#2563eb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Instrument Sans",system-ui,sans-serif}
.page{height:100svh;min-height:600px;display:flex;flex-direction:column;overflow:hidden}.page.page-enter .art-stage,.page.page-enter .copy>h1,.page.page-enter .copy>.intro,.page.page-enter .copy>.actions,.page.page-enter .modebar{opacity:0}.page.page-enter.is-loaded .art-stage{animation:homeArtIn .7s .08s both cubic-bezier(.22,1,.36,1)}.page.page-enter.is-loaded .copy>h1{animation:homeContentIn .58s .16s both cubic-bezier(.22,1,.36,1)}.page.page-enter.is-loaded .copy>.intro{animation:homeContentIn .58s .24s both cubic-bezier(.22,1,.36,1)}.page.page-enter.is-loaded .copy>.actions{animation:homeContentIn .58s .32s both cubic-bezier(.22,1,.36,1)}.page.page-enter.is-loaded .modebar{animation:homeBarIn .45s .38s both ease}@keyframes homeArtIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes homeContentIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes homeBarIn{from{opacity:0}to{opacity:1}}
.nav{height:92px;flex:0 0 92px;padding:32px 80px;display:flex;align-items:center;justify-content:space-between}
.logo{width:23px;height:28px;display:block}.navlinks{display:flex;gap:48px}.nav a,.secondary{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none}.navlinks a{position:relative;transition:color .22s ease}.navlinks a:hover,.navlinks a:focus-visible,.navlinks a.active{color:var(--ink)}.navlinks a::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:var(--orange);transform:scaleX(0);transform-origin:left center;transition:transform .62s cubic-bezier(.22,1,.36,1);transition-delay:0s;pointer-events:none}.navlinks a.active::after,.navlinks a.is-leaving::after{transform:scaleX(1);transition-delay:.18s}
.hero{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,1fr) minmax(350px,1fr);gap:56px;align-items:center;padding:clamp(24px,5vh,72px) 80px}
.art-stage{position:relative;width:100%;aspect-ratio:1312/1199;max-height:100%}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;opacity:0;transform:translateX(12px);transition:opacity .58s ease,transform .65s cubic-bezier(.22,1,.36,1);pointer-events:none}.art.is-active{opacity:1;transform:translateX(0);z-index:1}
.copy{display:flex;flex-direction:column;gap:clamp(22px,3.2vh,40px);align-items:flex-start}.copy>h1,.copy>.intro,.copy>.actions{transition:opacity .3s ease,transform .42s cubic-bezier(.22,1,.36,1)}.hero.is-switching .copy>h1,.hero.is-switching .copy>.intro,.hero.is-switching .copy>.actions{opacity:0;transform:translateY(8px)}.hero.is-entering .copy>h1{animation:copyIn .42s .03s both cubic-bezier(.22,1,.36,1)}.hero.is-entering .copy>.intro{animation:copyIn .42s .09s both cubic-bezier(.22,1,.36,1)}.hero.is-entering .copy>.actions{animation:copyIn .42s .15s both cubic-bezier(.22,1,.36,1)}@keyframes copyIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.art,.copy>h1,.copy>.intro,.copy>.actions,.switch,.knob,.navlinks a,.navlinks a::after,.mode-nudge,.mode-nudge path{transition:none!important;animation:none!important}}
h1{font-size:clamp(48px,4.45vw,64px);line-height:.95;letter-spacing:-.035em;margin:0;font-weight:700;max-width:612px}
.accent-green{color:var(--green);font-style:italic}.accent-orange{color:var(--orange);font-style:italic}.strike{text-decoration:line-through}
.intro{font-size:clamp(19px,1.67vw,24px);line-height:1.6;color:var(--body);margin:0;max-width:612px}
.actions{display:flex;align-items:center;gap:24px}.primary{border:0;border-radius:4px;background:var(--ink);color:#fff;padding:14px 28px;font:600 14px "Instrument Sans",sans-serif;text-decoration:none;cursor:pointer}.secondary{font-weight:600;border:0;background:none;padding:0;cursor:pointer}
.modebar{height:68px;flex:0 0 68px;background:var(--bar);display:flex;align-items:center;justify-content:center;position:relative}.mode-nudge{position:absolute;left:50%;bottom:52px;width:250px;text-align:center;transform:translateX(-50%) translateY(6px);opacity:0;visibility:hidden;pointer-events:none;color:#4b5563;font:500 16px/1.25 "Instrument Sans",sans-serif;font-style:italic;transition:opacity .5s ease,transform .55s cubic-bezier(.22,1,.36,1),visibility 0s linear .55s}.mode-nudge.is-visible{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);transition-delay:0s;animation:nudgeBob 1.8s .7s ease-in-out infinite}.mode-nudge svg{display:block;width:82px;height:38px;margin:3px auto 0;overflow:visible}.mode-nudge path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120}.mode-nudge.is-visible path{animation:nudgeDraw .8s .18s forwards cubic-bezier(.22,1,.36,1)}@keyframes nudgeDraw{to{stroke-dashoffset:0}}@keyframes nudgeBob{0%,100%{margin-bottom:0}50%{margin-bottom:5px}}
.mode{display:flex;align-items:center;gap:16px;font:500 16px/24px Inter,sans-serif;letter-spacing:.08px}.mode-label{color:var(--muted);cursor:pointer;transition:color .22s ease}.mode-label:hover,.mode-label:focus-visible,.mode-label.is-active{color:var(--ink)}
.switch{width:68px;height:36px;padding:2px;border:0;border-radius:999px;background:#e1e5ed;display:flex;align-items:center;cursor:pointer;transition:background .28s ease}.switch:hover{background:rgba(37,99,235,.5)}.knob{width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);display:grid;place-items:center;transform:translateX(0);transition:transform .2s}.knob:before{content:"×";font:500 20px/1 Inter;color:#6b7280}
body.unfiltered .switch{background:var(--blue)}body.unfiltered .switch:hover{background:rgba(37,99,235,.5)}body.unfiltered .knob{transform:translateX(32px)}body.unfiltered .knob:before{content:"✓";font-size:15px;color:var(--blue)}
.page.is-page-leaving .copy>.actions{opacity:0;transform:translateY(10px);transition-delay:0s}.page.is-page-leaving .copy>.intro{opacity:0;transform:translateY(10px);transition-delay:.06s}.page.is-page-leaving .copy>h1{opacity:0;transform:translateY(10px);transition-delay:.12s}.page.is-page-leaving .art-stage{opacity:0;transform:translateX(-20px);transition:opacity .5s .16s ease,transform .58s .16s cubic-bezier(.22,1,.36,1)}.page.is-page-leaving .modebar{opacity:0;transition:opacity .35s ease}@media(max-width:900px){.page{height:auto;min-height:100svh;overflow:visible}.nav{height:auto;flex:0 0 auto;padding:24px 28px}.navlinks{gap:24px}.hero{min-height:calc(100svh - 160px);grid-template-columns:1fr;gap:32px;padding:40px 28px 56px}.art-stage{max-width:560px;margin:auto}.copy{gap:28px}h1{font-size:clamp(44px,10vw,64px)}.intro{font-size:20px}.modebar{position:sticky;bottom:0;z-index:5}}
@media(max-width:520px){.nav{padding:22px 20px}.navlinks{gap:18px}.hero{padding:24px 20px 40px}.art{min-width:0}.copy{min-width:0}h1{font-size:44px}.intro{font-size:18px;line-height:1.55}.actions{align-items:flex-start;flex-direction:column;gap:18px}.mode{gap:10px;font-size:14px}.switch{transform:scale(.9)}}
</style></head>
<body><div class="page page-enter"><header class="nav">
<img class="logo" src="https://www.figma.com/api/mcp/asset/7f0add07-f3c1-4ee6-b118-19d59ed061c7.svg" alt="Dion">
<nav class="navlinks" aria-label="Main navigation"><a class="active" href="/" aria-current="page">Home</a><a href="#work">Work</a><a href="/about.html">About</a><a href="mailto:hello@pramadion.com">Contact</a></nav></header>
<main class="hero"><div class="art-stage"><img id="artFiltered" class="art is-active" src="https://www.figma.com/api/mcp/asset/74a2460d-db87-4423-b3aa-4b23267eb888.png" alt="" fetchpriority="high" decoding="async"><img id="artUnfiltered" class="art" src="https://www.figma.com/api/mcp/asset/8b13cb37-c6bb-414f-afa2-0b234c8a3e1e.png" alt="" loading="eager" decoding="async"></div>
<section class="copy" aria-live="polite"><h1 id="headline">Designing <span class="accent-green">thoughtful</span> digital <span class="accent-orange">products</span>.</h1>
<p class="intro" id="intro">Hi, I'm Dion - a Lead Product Designer based in Berlin with 13+ years of experience designing digital products across mobile and web.</p>
<div class="actions"><a class="primary" id="workCta" href="#work">View selected work →</a><button class="secondary" id="cvCta" type="button">Download CV</button></div></section></main>
<footer class="modebar"><div id="modeNudge" class="mode-nudge" aria-hidden="true"><span id="nudgeText">Try the wild side.</span><svg id="nudgeArrow" viewBox="0 0 82 38" aria-hidden="true"><path d="M3 4 C 24 5, 48 8, 60 24 C 65 30, 68 33, 76 34 M 67 27 L 76 34 L 68 37"/></svg></div><div class="mode"><span id="filteredLabel" class="mode-label is-active" role="button" tabindex="0">Filtered</span><button id="modeSwitch" class="switch" type="button" role="switch" aria-checked="false" aria-label="Toggle unfiltered mode"><span class="knob"></span></button><span id="unfilteredLabel" class="mode-label" role="button" tabindex="0">Unfiltered</span></div></footer></div>
<script>
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector(".page").classList.add("is-loaded")));
const filtered={art:"https://www.figma.com/api/mcp/asset/74a2460d-db87-4423-b3aa-4b23267eb888.png",headline:'Designing <span class="accent-green">thoughtful</span> digital <span class="accent-orange">products</span>.',intro:"Hi, I'm Dion - a Lead Product Designer based in Berlin with 13+ years of experience designing digital products across mobile and web.",work:"View selected work →",cv:"Download CV"};
const unfiltered={art:"https://www.figma.com/api/mcp/asset/8b13cb37-c6bb-414f-afa2-0b234c8a3e1e.png",headline:'Designing <span class="accent-green strike">fucking</span><span class="accent-green"> useful</span> digital <span class="accent-orange strike">shit</span>.',intro:"Hi, I’m Dion. I’ve spent 13+ years designing digital shit, arguing about edge cases, fixing things nobody thought about, and occasionally moving rectangles around until everyone agrees.",work:"Fine, show me the work →",cv:"Another goddamn CV"};
const sw=document.getElementById("modeSwitch"),modeNudge=document.getElementById("modeNudge"),nudgeArrow=document.getElementById("nudgeArrow"),nudgeText=document.getElementById("nudgeText"),filteredLabel=document.getElementById("filteredLabel"),unfilteredLabel=document.getElementById("unfilteredLabel"),hero=document.querySelector(".hero"),artFiltered=document.getElementById("artFiltered"),artUnfiltered=document.getElementById("artUnfiltered"),headline=document.getElementById("headline"),intro=document.getElementById("intro"),work=document.getElementById("workCta"),cv=document.getElementById("cvCta");let isUnfiltered=false,isAnimating=false,nudgeTimer=null,nudgeHideTimer=null;
const hideNudge=()=>{clearTimeout(nudgeHideTimer);modeNudge.classList.remove("is-visible")};const nudgeCopy=()=>isUnfiltered?"Back to the professional side.":"Try the wild side.";const scheduleNudge=(delay=11000)=>{clearTimeout(nudgeTimer);nudgeTimer=setTimeout(()=>{showNudge(nudgeCopy(),4200)},delay)};const showNudge=(text,duration=4200)=>{hideNudge();nudgeText.textContent=text;nudgeArrow.style.transform=isUnfiltered?"scaleX(-1)":"none";requestAnimationFrame(()=>modeNudge.classList.add("is-visible"));nudgeHideTimer=setTimeout(()=>{hideNudge();scheduleNudge(11000)},duration)};scheduleNudge(3000);
sw.addEventListener("click",()=>{if(isAnimating)return;clearTimeout(nudgeTimer);hideNudge();isAnimating=true;isUnfiltered=!isUnfiltered;const s=isUnfiltered?unfiltered:filtered;document.body.classList.toggle("unfiltered",isUnfiltered);sw.setAttribute("aria-checked",String(isUnfiltered));filteredLabel.classList.toggle("is-active",!isUnfiltered);unfilteredLabel.classList.toggle("is-active",isUnfiltered);hero.classList.remove("is-entering");hero.classList.add("is-switching");setTimeout(()=>{artFiltered.classList.toggle("is-active",!isUnfiltered);artUnfiltered.classList.toggle("is-active",isUnfiltered);headline.innerHTML=s.headline;intro.textContent=s.intro;work.textContent=s.work;cv.textContent=s.cv;hero.classList.remove("is-switching");void hero.offsetWidth;hero.classList.add("is-entering");setTimeout(()=>{hero.classList.remove("is-entering");isAnimating=false;nudgeTimer=setTimeout(()=>showNudge(nudgeCopy(),4500),1500)},620)},260);});
const setMode=wantUnfiltered=>{if(isAnimating||isUnfiltered===wantUnfiltered)return;sw.click()};filteredLabel.addEventListener("click",()=>setMode(false));unfilteredLabel.addEventListener("click",()=>setMode(true));filteredLabel.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setMode(false)}});unfilteredLabel.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setMode(true)}});
document.querySelectorAll(".navlinks a:not(.active)").forEach(link=>{link.addEventListener("click",e=>{const href=link.getAttribute("href");if(!href||href.startsWith("mailto:"))return;e.preventDefault();document.querySelectorAll(".navlinks a").forEach(a=>a.classList.remove("active","is-leaving"));link.classList.add("active","is-leaving");const page=document.querySelector(".page");setTimeout(()=>page&&page.classList.add("is-page-leaving"),260);setTimeout(()=>{if(href.startsWith("#")){const target=document.querySelector(href);if(target)target.scrollIntoView({behavior:"smooth"});else location.href=href}else location.href=href},980)})});
</script></body></html>
