<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9fafb">
<title>404 — Dion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9fafb;--ink:#111827;--orange:#ff9340}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Instrument Sans",system-ui,sans-serif}
main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 24px}
.wrap{width:min(980px,100%);display:flex;flex-direction:column;align-items:center;text-align:center}
.art{display:block;width:min(760px,88vw);height:auto;object-fit:contain}
h1{margin:24px 0 0;font-size:clamp(28px,4.2vw,50px);line-height:.98;letter-spacing:-.045em;font-weight:700;max-width:900px}
.home{margin-top:28px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 28px;border-radius:4px;background:var(--ink);color:#fff;text-decoration:none;font-size:14px;font-weight:600;transition:transform .2s ease,background-color .2s ease}
.home:hover{transform:translateY(-2px);background:#1f2937}
.home:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
@media(max-width:640px){
  main{padding:24px 20px}
  .art{width:min(640px,96vw)}
  h1{margin-top:18px;font-size:clamp(27px,8.4vw,39px)}
  .home{margin-top:24px}
}
@media(prefers-reduced-motion:reduce){
  .home{transition:none}
  .home:hover{transform:none}
}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <img class="art" src="/assets/404.png" alt="404 illustration">
    <h1>You are lost, dumbass!!</h1>
    <a class="home" href="/">Take me to the homepage</a>
  </div>
</main>
</body>
</html>
